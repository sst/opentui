name: Node FFI x64 Teardown Stress

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Fresh Node processes per runner
        required: true
        default: "600"
        type: string
      target_ms:
        description: Timed FFI work per process in milliseconds
        required: true
        default: "15"
        type: string
      warmup_ms:
        description: FFI warmup per process in milliseconds
        required: true
        default: "10"
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/node-ffi-x64-stress.yml
      - bun.lock
      - packages/core/package.json
      - packages/core/src/platform/ffi.ts
      - packages/core/src/zig.ts
      - packages/core/src/zig-structs.ts
      - packages/core/src/benchmark/ffi-fast-path-scenarios.ts
      - packages/core/src/benchmark/ffi-fast-path-stress.ts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUN_VERSION: 1.3.14
  NODE_VERSION: 26.4.0
  ZIG_VERSION: 0.15.2

jobs:
  stress:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux native x64
            os: blacksmith-8vcpu-ubuntu-2404
            mode: native
            build_all: false
          - label: macOS Intel native x64
            os: macos-15-intel
            mode: native
            build_all: false
          - label: Windows native x64
            os: blacksmith-8vcpu-windows-2025
            mode: native
            build_all: false
          - label: macOS Rosetta x64
            os: blacksmith-12vcpu-macos-15
            mode: rosetta
            build_all: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node x64
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Install dependencies
        run: bun install

      - name: Build native library
        working-directory: packages/core
        run: bun run build:native ${{ matrix.build_all && '--all' || '' }}

      - name: Configure Windows crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpDirectory = Join-Path $env:GITHUB_WORKSPACE "packages/core/ffi-stress-diagnostics/windows-dumps"
          New-Item -ItemType Directory -Force -Path $dumpDirectory | Out-Null
          $registryPath = "HKLM:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\node.exe"
          New-Item -Path $registryPath -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpFolder -PropertyType ExpandString -Value $dumpDirectory -Force | Out-Null
          New-ItemProperty -Path $registryPath -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null

      - name: Configure Linux core dumps
        if: runner.os == 'Linux'
        working-directory: packages/core
        run: |
          mkdir -p ffi-stress-diagnostics
          desired_pattern="$PWD/ffi-stress-diagnostics/core.%e.%p"
          if sudo sysctl -w "kernel.core_pattern=$desired_pattern" > ffi-stress-diagnostics/core-dump-setup.txt 2>&1; then
            printf 'configured=true\n' >> ffi-stress-diagnostics/core-dump-setup.txt
          else
            printf 'configured=false\n' >> ffi-stress-diagnostics/core-dump-setup.txt
          fi
          printf 'effective_pattern=' >> ffi-stress-diagnostics/core-dump-setup.txt
          tr -d '\n' < /proc/sys/kernel/core_pattern >> ffi-stress-diagnostics/core-dump-setup.txt
          printf '\n' >> ffi-stress-diagnostics/core-dump-setup.txt
          cat ffi-stress-diagnostics/core-dump-setup.txt

      - name: Capture runtime environment
        working-directory: packages/core
        run: |
          mkdir -p ffi-stress-diagnostics
          {
            uname -a
            node --version
            node -p 'JSON.stringify({ execPath: process.execPath, platform: process.platform, arch: process.arch, versions: process.versions }, null, 2)'
            node -e 'console.log(JSON.stringify(process.report.getReport().header, null, 2))'
            node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); console.log(`node_sha256=${createHash("sha256").update(readFileSync(process.execPath)).digest("hex")}`)'
            bun --version
            bun -e 'console.log(JSON.stringify({ execPath: process.execPath, platform: process.platform, arch: process.arch, versions: process.versions }, null, 2))'
            node -p '"bun-ffi-structs=" + require("./node_modules/bun-ffi-structs/package.json").version'
            zig version
            native_package="node_modules/@opentui/core-$(node -p 'process.platform + "-" + process.arch')"
            printf 'native_package=%s\n' "$native_package"
            ls -la "$native_package"
            for native_binary in "$native_package"/*.dylib "$native_package"/*.so "$native_package"/*.dll; do
              if [ -f "$native_binary" ]; then
                node -e 'const { createHash } = require("node:crypto"); const { readFileSync } = require("node:fs"); const path = process.argv[1]; console.log(`${path}_sha256=${createHash("sha256").update(readFileSync(path)).digest("hex")}`)' "$native_binary"
              fi
            done
            if [ "${{ runner.os }}" = "macOS" ]; then
              sysctl -n machdep.cpu.brand_string
              sysctl -n hw.optional.arm64
            fi
            if [ "${{ runner.os }}" = "Linux" ]; then
              printf 'core_pattern='
              tr -d '\n' < /proc/sys/kernel/core_pattern
              printf '\ncore_limit='
              ulimit -c
            fi
          } > ffi-stress-diagnostics/environment.txt 2>&1
          native_package="node_modules/@opentui/core-$(node -p 'process.platform + "-" + process.arch')"
          mkdir -p ffi-stress-diagnostics/native-package
          cp "$native_package"/* ffi-stress-diagnostics/native-package/
          cat ffi-stress-diagnostics/environment.txt
          if [ "${{ runner.os }}" = "macOS" ]; then
            touch ffi-stress-diagnostics/macos-stress-start
          fi
          test "$(node -p 'process.arch')" = "x64"
          if [ "${{ matrix.mode }}" = "rosetta" ]; then
            test "$(uname -m)" = "arm64"
            test "$(node -p 'process.platform + "-" + process.arch')" = "darwin-x64"
          fi

      - name: Run fresh-process stress
        working-directory: packages/core
        env:
          STRESS_RUNS: ${{ inputs.runs || '600' }}
          STRESS_TARGET_MS: ${{ inputs.target_ms || '15' }}
          STRESS_WARMUP_MS: ${{ inputs.warmup_ms || '10' }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            ulimit -c unlimited
          fi
          bun run stress:ffi-fast-path \
            --label="${{ matrix.label }}" \
            --runs="$STRESS_RUNS" \
            --target-ms="$STRESS_TARGET_MS" \
            --warmup-ms="$STRESS_WARMUP_MS" \
            --output=ffi-stress-diagnostics/stress \
            --allow-crashes

      - name: Collect macOS crash reports
        if: always() && runner.os == 'macOS'
        working-directory: packages/core
        run: |
          sleep 10
          mkdir -p ffi-stress-diagnostics/macos-crash-reports
          for report_directory in "$HOME/Library/Logs/DiagnosticReports" "/Library/Logs/DiagnosticReports"; do
            if [ -d "$report_directory" ]; then
              while IFS= read -r -d '' report; do
                cp "$report" ffi-stress-diagnostics/macos-crash-reports/
              done < <(find "$report_directory" -type f -newer ffi-stress-diagnostics/macos-stress-start \( -iname 'node*.ips' -o -iname 'node*.crash' \) -print0)
            fi
          done

      - name: Publish run summary
        if: always()
        working-directory: packages/core
        run: |
          if [ -f ffi-stress-diagnostics/stress/summary.md ]; then
            cat ffi-stress-diagnostics/stress/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '### Node FFI teardown stress: %s\n\nStress did not produce a summary.\n' "${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-ffi-stress-${{ strategy.job-index }}
          path: packages/core/ffi-stress-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce native x64 stability
        if: matrix.mode == 'native'
        working-directory: packages/core
        run: |
          bun -e '
            const report = await Bun.file("ffi-stress-diagnostics/stress/manifest.json").json()
            if (report.summary.completed !== report.config.runs) throw new Error("stress run was incomplete")
            if (report.summary.errors !== 0) throw new Error(`stress had ${report.summary.errors} non-crash errors`)
            if (report.summary.otherCrashes !== 0) throw new Error(`stress had ${report.summary.otherCrashes} unrelated crashes`)
            if (report.summary.targetCrashes !== 0) throw new Error(`native x64 reproduced ${report.summary.targetCrashes} teardown crashes`)
          '

  classify:
    name: Classify x64 results
    needs: stress
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Download diagnostics
        uses: actions/download-artifact@v8
        with:
          pattern: node-ffi-stress-*
          path: diagnostics

      - name: Classify reproduction
        run: |
          node <<'NODE'
          const { appendFileSync, readdirSync, readFileSync, statSync, writeFileSync } = require("node:fs")
          const { join } = require("node:path")

          const manifests = []
          const visit = (directory) => {
            for (const name of readdirSync(directory)) {
              const path = join(directory, name)
              if (statSync(path).isDirectory()) visit(path)
              else if (name === "manifest.json") manifests.push(JSON.parse(readFileSync(path, "utf8")))
            }
          }
          visit("diagnostics")

          const rows = manifests
            .toSorted((left, right) => left.label.localeCompare(right.label))
            .map((report) => ({
              label: report.label,
              mode: report.label.includes("Rosetta") ? "Rosetta" : "native",
              completed: `${report.summary.completed}/${report.config.runs}`,
              successes: report.summary.successes,
              targetCrashes: report.summary.targetCrashes,
              otherCrashes: report.summary.otherCrashes,
              errors: report.summary.errors,
            }))
          const nativeCrashes = rows.filter((row) => row.mode === "native").reduce((sum, row) => sum + row.targetCrashes, 0)
          const rosettaCrashes = rows.filter((row) => row.mode === "Rosetta").reduce((sum, row) => sum + row.targetCrashes, 0)
          const incomplete = manifests.length !== 4 || manifests.some(
            (report) =>
              report.summary.completed !== report.config.runs ||
              report.summary.errors !== 0 ||
              report.summary.otherCrashes !== 0,
          )
          const conclusion = incomplete
            ? "Inconclusive: one or more diagnostic runs were incomplete or invalid."
            : nativeCrashes > 0
              ? "Non-Rosetta native x64 reproduced the crash. A comprehensive crash-debugging document is required."
              : rosettaCrashes > 0
                ? "Only Rosetta reproduced the crash in this CI run."
                : "No runner reproduced the crash; this run is inconclusive about Rosetta exclusivity."
          const markdown = [
            "## Node FFI x64 teardown classification",
            "",
            `**${conclusion}**`,
            "",
            "| Runner | Mode | Attempts | Successes | Target crashes | Other crashes | Errors |",
            "| --- | --- | ---: | ---: | ---: | ---: | ---: |",
            ...rows.map((row) => `| ${row.label} | ${row.mode} | ${row.completed} | ${row.successes} | ${row.targetCrashes} | ${row.otherCrashes} | ${row.errors} |`),
            "",
          ].join("\n")
          writeFileSync("classification.md", markdown)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown)
          if (incomplete || nativeCrashes > 0) process.exit(1)
          NODE

      - name: Upload classification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-ffi-stress-classification
          path: classification.md
          if-no-files-found: error
          retention-days: 14
