name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.4.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  ZIG_VERSION: "0.15.2"
  BUN_VERSION: "1.3.14"

jobs:
  # ─── Build + publish all 4 native targets from a macOS runner ─────────────
  # macOS runner has the macOS SDK for darwin-arm64, and Zig cross-compiles
  # the other 3 targets (linux-x64 gnu+musl, win32-x64) without extra SDKs.
  build-and-publish:
    name: Build & Publish
    runs-on: macos-latest
    environment: NPM

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $V"

      - name: Build native binaries (all 4 fork targets)
        working-directory: packages/core
        run: bun run build:native -- --all

      - name: Verify native outputs
        run: |
          set -e
          echo "Built native packages:"
          ls packages/core/node_modules/@lexwdex-org/

          test -f packages/core/node_modules/@lexwdex-org/core-darwin-arm64/libopentui.dylib || (echo "❌ darwin-arm64 missing" && exit 1)
          test -f packages/core/node_modules/@lexwdex-org/core-linux-x64/libopentui.so || (echo "❌ linux-x64 missing" && exit 1)
          test -f packages/core/node_modules/@lexwdex-org/core-linux-x64-musl/libopentui.so || (echo "❌ linux-x64-musl missing" && exit 1)
          test -f packages/core/node_modules/@lexwdex-org/core-win32-x64/opentui.dll || (echo "❌ win32-x64 missing" && exit 1)
          echo "✅ All 4 native targets verified"

      - name: Configure npm auth
        run: |
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${{ secrets.AUTH_TOKEN }}" >> ~/.npmrc
          echo "=== npm whoami ==="
          npm whoami

      - name: Publish native packages
        run: |
          for pkg in core-darwin-arm64 core-linux-x64 core-linux-x64-musl core-win32-x64; do
            dir="packages/core/node_modules/@lexwdex-org/$pkg"
            echo "=== Publishing @lexwdex-org/$pkg ==="
            (cd "$dir" && npm publish --access public 2>&1) || echo "⚠️  $pkg failed (may already exist)"
          done

      - name: Build library (TS bundle)
        working-directory: packages/core
        run: bun run build:lib

      - name: Publish main package
        run: |
          echo "Publishing @lexwdex-org/core..."
          (cd packages/core/dist && npm publish --access public) || echo "⚠️  core may already exist, skipping"

      - name: Build & publish keymap
        run: |
          cd packages/keymap && bun run build
          (cd dist && npm publish --access public) || echo "⚠️  keymap may already exist, skipping"

      - name: Build & publish solid
        run: |
          cd packages/solid && bun run build
          (cd dist && npm publish --access public) || echo "⚠️  solid may already exist, skipping"

      - name: Summary
        run: |
          echo "============================================"
          echo "Published @lexwdex-org/*@${{ steps.ver.outputs.version }}"
          echo "============================================"
          echo "Native targets:"
          echo "  - @lexwdex-org/core-darwin-arm64  (Apple Silicon)"
          echo "  - @lexwdex-org/core-linux-x64     (glibc)"
          echo "  - @lexwdex-org/core-linux-x64-musl (Alpine)"
          echo "  - @lexwdex-org/core-win32-x64     (Win10/11)"
          echo "Main packages:"
          echo "  - @lexwdex-org/core"
          echo "  - @lexwdex-org/keymap"
          echo "  - @lexwdex-org/solid"
