name: NPM Snapshot Release

on:
  push:
    tags:
      - "*snapshot*"

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare Snapshot Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      snapshotVersion: ${{ steps.version_scheme.outputs.version }}

    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Extracted tag: $TAG"

      - name: Generate snapshot version
        id: version_scheme
        run: |
          COMMIT_SHA=${GITHUB_SHA::8}

          VERSION="0.0.0-$(date +%Y%m%d)-${COMMIT_SHA}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using snapshot version: $VERSION"

  build-static-core:
    name: Build Static Core
    needs: prepare
    uses: ./.github/workflows/build-static-core.yml
    with:
      version: ${{ needs.prepare.outputs.tag }}

  release:
    name: Publish Snapshot Packages
    needs: prepare
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: bun i

      - name: Prepare release versions
        run: bun run prepare-release "${{ needs.prepare.outputs.snapshotVersion }}"

      - name: Build packages (cross-compile for all platforms)
        run: |
          cd packages/core
          bun run build:native --all
          bun run build:lib
          cd ../solid && bun run build
          cd ../react && bun run build

      - name: Publish packages
        run: bun run publish
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CI: true
