name: Build Core

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Core - Build and Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: |
          cd packages/core
          bun run build

      - name: Run tests
        run: |
          cd packages/core
          bun run test

  build-complete:
    name: Core - Build and Test
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "Build failed on one or more platforms"
            exit 1
          fi
          echo "All platform builds succeeded"
