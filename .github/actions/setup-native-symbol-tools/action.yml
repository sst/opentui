name: Setup native symbol tools
description: Make cross-target LLVM tools available to native package builds
runs:
  using: composite
  steps:
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew list llvm >/dev/null 2>&1 || brew install llvm
        echo "LLVM_BIN=$(brew --prefix llvm)/bin" >> "$GITHUB_ENV"
