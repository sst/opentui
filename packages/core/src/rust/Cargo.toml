[package]
name = "opentui"
version = "0.1.84"
edition = "2021"
license = "MIT"
description = "OpenTUI native core - terminal UI library with C ABI for FFI"

[lib]
name = "opentui"
crate-type = ["cdylib"]

[dependencies]
unicode-width = "0.2"
unicode-segmentation = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
